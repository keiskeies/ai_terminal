name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # lockfile 要求 Flutter >= 3.44；使用本地已验证的 3.47.8 构建
  FLUTTER_VERSION: '3.47.8'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Build macOS
        run: |
          cd ai_terminal
          flutter build macos --release
      - name: Package macOS
        run: |
          cd ai_terminal/build/macos/Build/Products/Release
          zip -r -y ${{ github.workspace }}/AI_Terminal_${{ github.ref_name }}_macOS.zip "AI Terminal.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: AI_Terminal_${{ github.ref_name }}_macOS.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      # 现有 iOS 工程是 CocoaPods 结构；Flutter 3.47 默认启用 SPM，
      # 在缺少 SPM 集成信息的旧工程上会报 "Xcode workspace not found"。
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager
      - name: Build iOS (no codesign)
        run: |
          cd ai_terminal
          flutter build ios --release --no-codesign
      - name: Package iOS IPA
        run: |
          cd ai_terminal
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r ${{ github.workspace }}/AI_Terminal_${{ github.ref_name }}_iOS.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: AI_Terminal_${{ github.ref_name }}_iOS.ipa

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Patch Flutter Gradle settings
        run: |
          # Add gradlePluginPortal() to Flutter's settings.gradle.kts so kotlin-dsl plugin can be resolved
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          SETTINGS="$FLUTTER_SDK/packages/flutter_tools/gradle/settings.gradle.kts"
          echo "Patching $SETTINGS"
          if ! grep -q 'gradlePluginPortal' "$SETTINGS"; then
            sed -i.bak '/mavenCentral()/a\        gradlePluginPortal()' "$SETTINGS"
            echo "Patched successfully"
          else
            echo "Already patched"
          fi
      - name: Build Android APK
        run: |
          cd ai_terminal
          flutter build apk --release
      - name: Rename APK
        run: |
          cp ai_terminal/build/app/outputs/flutter-apk/app-release.apk AI_Terminal_${{ github.ref_name }}_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: AI_Terminal_${{ github.ref_name }}_Android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows
        run: |
          cd ai_terminal
          flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path ai_terminal/build/windows/x64/runner/Release/* -DestinationPath AI_Terminal_${{ github.ref_name }}_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: AI_Terminal_${{ github.ref_name }}_Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build libgcrypt20-dev libsecret-1-dev libjsoncpp-dev
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux
        run: |
          cd ai_terminal
          flutter build linux --release
      - name: Package Linux
        run: |
          cd ai_terminal/build/linux/x64/release/bundle
          tar czf ${{ github.workspace }}/AI_Terminal_${{ github.ref_name }}_Linux_x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: AI_Terminal_${{ github.ref_name }}_Linux_x64.tar.gz

  create-release:
    needs: [build-macos, build-ios, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | head -20
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Terminal ${{ github.ref_name }}
          body: |
            ## AI Terminal ${{ github.ref_name }}

            **用自然语言操控服务器，AI 替你敲命令。**

            AI Terminal 是一款将 AI 助手与 SSH / 本地终端深度集成的跨平台应用。无论你是刚买服务器的小白、不想记命令的开发者、还是需要批量管理服务器的运维人员——打开它，用中文告诉 AI 你要干什么，它帮你连服务器、跑命令、装软件、查问题。全程安全可控。

            ### 🆕 v1.3.9 新功能 · 回答整段复制 & 终端右键菜单

            v1.3.9 聚焦日常操作手感：Agent 回答可跨段选择、一键整段复制；信息按常驻/折叠/按需分级；思考真正流式输出；终端右键成为完整工作区入口；Windows 本机监控修复。

            > **本次为重新构建**：补齐联网搜索、MCP、诊断、内置运维模板与终端右键菜单的英文界面，并更新 README 实机截图与演示 GIF。

            #### 📋 Agent 回答
            - **整段选择与复制**：整条回答统一选区，可跨段落拖选；消息下方一键复制完整回答
            - **信息分级**：结论、操作按钮、状态常驻；计划/变更/下一步在任务结束后自动收起；证据与命令输出按需展开
            - **用户消息可收起**：默认最多两行，点开查看全文
            - **思考流式输出**：`reasoning_content` 显示为可折叠思考块，ReAct 实时思考连续打印

            #### 🖥️ 终端与日志
            - **右键菜单扩展**：复制/粘贴（多行确认）/全选、导出会话到文件、清屏/清回滚、字号调整
            - **选区动作**：发给 Agent、存为片段、确认后执行
            - **上下文动作**：打开/复制链接、复制路径、问 Agent；远程会话直达 SFTP/变更记录/审计
            - **结构化日志**：按级别、标签、当前任务筛选，一条事件一行
            - **Windows 监控修复**：改用 CIM + 编码 PowerShell，非英文语言环境不再显示 0 或「-」

            #### 🎨 视觉与细节
            - 表面阶梯 + 独立数据卡片底色，发丝线分层
            - 圆形发送按钮、加高输入框、移除字数计数；连接状态只保留在标签页圆点
            - 行内代码改用字色区分

            #### 📁 继续包含
            - v1.3.8 的石墨青主题与中英文操作单
            - v1.3.7 的操作单、文件传输/编辑安全加固

            ### 🆕 v1.3.7 新功能 · Agent 操作单 & 文件安全加固

            v1.3.7 聚焦 **Agent 回答可读性** 与 **文件操作安全**：思考、计划、执行、结果按“操作单”分层展示；上传、下载、修改文件全链路加固，中文/emoji 内容不再依赖模型手算 base64。

            #### 🧭 Agent 操作单
            - **结论优先**：任务完成先给结论，再展开现状、变更与建议
            - **计划/任务清单**：模型声明的步骤、进度计数与当前步骤命令一目了然
            - **证据折叠**：命令、输出、耗时、退出码、失败分类收进证据层，主答案保持干净
            - **变更台账与回滚**：文件/命令变更可追溯，支持一键回滚
            - **失败恢复**：权限不足/断线/超时给出针对性操作，可重试失败主机或继续任务
            - **多主机结果矩阵**：广播/批量操作按主机展示状态、耗时与输出

            #### 📁 文件传输与编辑安全
            - **新增 `sftp_download`**：Agent 可直接从服务器下载单文件或目录，自动创建本地目录
            - **传输原子化**：上传/下载先写临时文件再替换，失败不会截断原文件
            - **目录完整性**：递归上传/下载保留空目录，支持排除 `node_modules`/`.git`
            - **本地文件编辑**：Windows/macOS/Linux 本地 `file_write` 支持写入/追加/备份，`file_patch` 支持本地补丁
            - **字节级编辑**：`file_patch` 保留 BOM、CRLF 与非 UTF-8 字节
            - **中文更可靠**：`file_write`/`file_patch` 支持纯文本参数，避免模型手算中文 base64 出错
            - **SFTP 编辑器防截断**：大文件/非 UTF-8 拒绝打开，BOM 原样保留，保存失败自动恢复

            #### 🐛 关键修复
            - 修复 Windows 目录上传把嵌套文件平铺成带反斜杠文件名
            - 修复 `broadcast_upload` 单文件把目录名当文件名
            - 修复下载失败可能留下半成品、本地父路径是文件时误建目录
            - 修复 SFTP 编辑器打开大文件后保存截断文件
            - 升级 `dartssh2 3.3.1`，支持 SFTP `posix-rename` 原子替换

            #### ✅ 质量验证
            - 375 个单元/Widget 测试通过
            - 16 个真实 SSH + 真实 LLM 端到端测试通过（上传/下载/改文件/多主机编排）

            ### 🌟 适合谁用？

            - **小白 / 非技术人员**：不会命令行？没关系。"帮我装个 Docker"、"检查服务器漏洞"——一句话搞定
            - **开发者**：不用每次都百度同样的命令，AI 记得比你清楚
            - **运维 / DevOps**：告别重复 SSH，Agent 自动执行安装、配置、巡检；多机编排批量操作
            - **产品经理 / 一人公司**：技术合伙人的活，你一个人也能干

            ### 🚀 核心特性

            - 🤖 **Agent 智能执行**：AI 自动生成命令并循环执行（ReAct 框架），直到任务完成
            - 📊 **服务器监控**：CPU/内存/磁盘/网络实时监控面板，多主机并行
            - 📝 **变更台账**：完整审计日志，操作可追溯，变更可回滚
            - 📋 **运维工作流**：内置 Runbook 模板，一键执行常见运维任务
            - 🔔 **通知中心**：任务完成、异常告警、安全提醒，即时推送
            - 🎯 **多机编排**：单 Agent 调度多台主机，命令按 host 路由执行，状态实时回显
            - 🛡️ **三重安全防护**：行为边界提示词 → SafetyGuard 命令分级 → 危险操作需 CONFIRM 确认
            - 🔐 **零明文凭据**：密码/私钥存储在系统 Keychain / Keystore，永不明文落盘
            - 🧠 **知识库驱动**：内置 300+ 软件安装/配置条目，按平台匹配命令
            - 🛠️ **AI 工具调用**：SFTP 跨机上传、文件同步、经验记忆等非 shell 工具
            - 🖥️ **5 平台原生**：macOS / Linux / Windows / Android / iOS 全平台支持
            - 🌍 **14 种语言**：中文/英文/日语/韩语/法语/德语/西班牙语/俄语/葡萄牙语等
            - 📡 **SSH 远程 + 本地终端**：连接池复用，多标签共享连接，切换零延迟
            - 🌊 **流式输出**：AI 响应实时渲染，终端命令即时回显
            - 🌐 **22 个 AI 供应商**：DeepSeek / Qwen / Claude / Gemini / Ollama 等，支持远程配置更新
            - 💾 **会话持久化**：对话历史与结构化事件本地存储，切换会话不丢失上下文

            ### 🛡️ 安全设计

            - **密码存储**：系统级安全存储（macOS Keychain / Android Keystore），本地数据库只存元数据
            - **命令安全**：SafetyGuard 四级拦截——blocked 直接拦截、warn 需 CONFIRM 确认、info 低风险提示、safe 直接执行
            - **Agent 边界**：用户说"检查/查看"时只执行只读命令；禁止擅自安装/修改配置；发现问题先报告不自修
            - **变更审计**：所有 Agent 操作自动记录，支持审计追溯和回滚建议

            ### 📦 下载

            | 平台 | 文件 |
            |------|------|
            | macOS | `AI_Terminal_${{ github.ref_name }}_macOS.zip` |
            | iOS | `AI_Terminal_${{ github.ref_name }}_iOS.ipa` |
            | Android | `AI_Terminal_${{ github.ref_name }}_Android.apk` |
            | Windows | `AI_Terminal_${{ github.ref_name }}_Windows.zip` |
            | Linux x64 | `AI_Terminal_${{ github.ref_name }}_Linux_x64.tar.gz` |

            ### 🍎 macOS 安装须知

            由于本应用未经过 Apple 公证(非 App Store 分发),首次打开 macOS 会提示「无法验证开发者」。请按以下任一方式处理:

            **方式一:命令行(推荐,一行搞定)**
            ```bash
            xattr -cr "/Applications/AI Terminal.app"
            ```

            **方式二:右键打开**
            1. 解压 zip 后,将 `AI Terminal.app` 拖入 `/Applications`
            2. 在 Finder 中**右键**点击应用图标,选择「打开」
            3. 弹出对话框会多出「打开」按钮,点击即可
            4. 之后可正常打开,不会再提示

            ### 📖 文档

            - [官网](https://ai-terminal.keiskei.top)
            - [README（多语言）](https://github.com/keiskeies/ai_terminal#readme)
            - [常见问题](https://github.com/keiskeies/ai_terminal/blob/main/QUESTION.md)

            ---

            ## AI Terminal ${{ github.ref_name }}

            **Control your servers with natural language. AI runs the commands for you.**

            AI Terminal is a cross-platform app that deeply integrates an AI assistant with SSH and local terminals. Whether you're a beginner who just rented a VPS, a developer tired of googling commands, or a DevOps engineer managing dozens of servers — open it, tell the AI what you want in plain English (or Chinese), and it handles the rest. Safe, transparent, and under your control.

            ### 🆕 What's New in v1.3.9 · Whole-Answer Copy & Terminal Context Menu

            v1.3.9 focuses on day-to-day ergonomics: select and copy an entire Agent answer, keep information layered, stream reasoning as it happens, turn the terminal context menu into a real workspace, and fix Windows local monitoring.

            > **Rebuilt release**: completes the English UI for Web Search, MCP, Diagnostics, built-in runbooks, and the terminal context menu, and refreshes the README screenshots and demo GIF.

            #### 📋 Agent answers
            - **Whole-answer selection & copy**: one selection region across the answer, plus a one-click copy button under the message
            - **Information hierarchy**: conclusion, action controls and status stay visible; plan, change ledger and next actions fold when a run ends; evidence and command output open on demand
            - **Collapsible user messages**: two lines by default, expand for the full text
            - **Streamed reasoning**: `reasoning_content` renders as a collapsible thinking block, and the live ReAct thought streams continuously

            #### 🖥️ Terminal & logs
            - **Expanded context menu**: copy / paste (confirm for multi-line) / select all, export the transcript to a file, clear buffer or scrollback, and adjust the font size
            - **Selection actions**: send to the Agent, save as a snippet, or run after confirmation
            - **Contextual actions**: open / copy a link, copy a path, ask the Agent; remote sessions jump straight to SFTP, change records and the audit log
            - **Structured logs**: filter by level, tag or current task, one event per line
            - **Windows monitoring fixed**: CIM through an encoded PowerShell command, so non-English locales no longer show 0 or "-"

            #### 🎨 Visual details
            - Surface ladder with independent data-card backgrounds and hairline separation
            - Circular send button, taller input, no character counter; connection state lives only in the tab status dot
            - Inline code is tinted by color instead of a background patch

            #### 📁 Still included
            - The v1.3.8 graphite theme and English/Chinese operation sheet
            - The v1.3.7 operation sheet and file transfer/edit safety work

            ### 🆕 What's New in v1.3.7 · Agent Operation Sheet & File Safety

            v1.3.7 focuses on **Agent answer readability** and **file operation safety**: thinking, plans, execution and results are now layered into an "operation sheet"; upload, download and editing are hardened end-to-end, and Chinese/emoji content no longer depends on the model computing base64 by hand.

            #### 🧭 Agent Operation Sheet
            - **Conclusion first**: get the result up front, then the current state, changes and recommendations
            - **Plan/task checklist**: model-declared steps, progress counts and the command under the active step
            - **Folded evidence**: commands, output, duration, exit code and failure category stay in an evidence layer
            - **Change ledger & rollback**: file/command changes are traceable and can be rolled back
            - **Failure recovery**: targeted actions for permission, disconnect and timeout failures; retry failed hosts or continue the task
            - **Multi-host result matrix**: broadcast/batch operations show per-host status, duration and output

            #### 📁 File Transfer & Editing Safety
            - **New `sftp_download`**: the Agent can download single files or directories from a server, creating local directories automatically
            - **Atomic transfers**: upload/download write to a temporary file before replacing, so failures never truncate the original
            - **Directory integrity**: recursive transfers preserve empty directories and support excluding `node_modules`/`.git`
            - **Local editing**: `file_write` now supports write/append/backup on Windows/macOS/Linux, and `file_patch` supports local files
            - **Byte-level patches**: `file_patch` preserves BOM, CRLF and non-UTF-8 bytes
            - **Reliable Chinese text**: `file_write`/`file_patch` accept plain-text parameters, so the model no longer has to compute Chinese base64
            - **SFTP editor protection**: oversized/non-UTF-8 files are refused, BOM is preserved, and saves restore the original on failure

            #### 🐛 Key Fixes
            - Fixed Windows directory uploads flattening nested files into names containing backslashes
            - Fixed `broadcast_upload` treating the target directory as the file name for single-file uploads
            - Fixed partial files left by failed downloads and accidental directory creation when the local parent is a file
            - Fixed the SFTP editor truncating large files on save
            - Upgraded to `dartssh2 3.3.1` for SFTP `posix-rename` atomic replacement

            #### ✅ Quality
            - 375 unit/widget tests passing
            - 16 real SSH + real LLM end-to-end tests passing (upload/download/edit/multi-host orchestration)

            ### 🌟 Who is this for?

            - **Beginners**: Never used a terminal? No problem. "Install Docker" or "check for vulnerabilities" — one sentence solves it
            - **Developers**: Stop googling the same commands. AI remembers them for you
            - **DevOps / SysAdmins**: Skip repetitive SSH sessions. Agent handles installs, configs, and health checks; orchestrate across multiple hosts
            - **PMs / Solo founders**: Run server operations without a dedicated engineer

            ### 🚀 Core Features

            - 🤖 **Agent Auto-Execution**: AI generates and executes commands in a ReAct loop until task completion
            - 📊 **Server Monitoring**: Real-time CPU/memory/disk/network dashboard, multi-host parallel
            - 📝 **Change Records**: Full audit logs, traceable operations, rollback-ready
            - 📋 **Ops Runbooks**: Built-in Runbook templates, one-click common ops tasks
            - 🔔 **Notification Center**: Task completion, anomaly alerts, security reminders — pushed instantly
            - 🎯 **Multi-Host Orchestration**: Single Agent dispatches commands across multiple hosts, routed by hostId, with live status feedback
            - 🛡️ **Triple Security**: Behavior boundary prompts → SafetyGuard command classification → Dangerous ops require CONFIRM
            - 🔐 **Zero Plaintext Credentials**: Passwords/keys in system Keychain / Keystore, never on disk
            - 🧠 **Knowledge-Driven**: 300+ software install/config entries, matched by platform
            - 🛠️ **AI Tool Calling**: SFTP cross-host upload, file sync, experience memory and other non-shell tools
            - 🖥️ **5 Native Platforms**: macOS / Linux / Windows / Android / iOS
            - 🌍 **14 Languages**: Chinese / English / Japanese / Korean / French / German / Spanish / Russian / Portuguese & more
            - 📡 **SSH Remote + Local Terminal**: Connection pooling, shared connections, zero-delay switching
            - 🌊 **Streaming Output**: Real-time AI responses and terminal output
            - 🌐 **22 AI Providers**: DeepSeek / Qwen / Claude / Gemini / Ollama & more
            - 💾 **Session Persistence**: Conversation history and structured events stored locally, no context loss when switching sessions

            ### 🛡️ Security

            - **Credential Storage**: System-level secure storage (Keychain / Keystore), metadata only in local DB
            - **Command Safety**: SafetyGuard 4-level interception — blocked / warn (CONFIRM required) / info / safe
            - **Agent Boundaries**: Read-only for "check/inspect" requests; no unauthorized installs/modifications; report first, never self-fix
            - **Change Auditing**: All Agent operations automatically logged, with audit trail and rollback suggestions

