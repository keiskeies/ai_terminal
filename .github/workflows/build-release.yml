name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # lockfile 要求 Flutter >= 3.44；使用本地已验证的 3.47.8 构建
  FLUTTER_VERSION: '3.47.8'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Build macOS
        run: |
          cd ai_terminal
          flutter build macos --release
      - name: Package macOS
        run: |
          cd ai_terminal/build/macos/Build/Products/Release
          zip -r -y ${{ github.workspace }}/AI_Terminal_${{ github.ref_name }}_macOS.zip "AI Terminal.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: AI_Terminal_${{ github.ref_name }}_macOS.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      # 现有 iOS 工程是 CocoaPods 结构；Flutter 3.47 默认启用 SPM，
      # 在缺少 SPM 集成信息的旧工程上会报 "Xcode workspace not found"。
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager
      - name: Build iOS (no codesign)
        run: |
          cd ai_terminal
          flutter build ios --release --no-codesign
      - name: Package iOS IPA
        run: |
          cd ai_terminal
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r ${{ github.workspace }}/AI_Terminal_${{ github.ref_name }}_iOS.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: AI_Terminal_${{ github.ref_name }}_iOS.ipa

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest 自 2026-10 的镜像迁移后默认 JDK 已到 25，而本项目
      # Gradle 8.14 最高只支持 24，flutter build apk 会以
      # "Java/Gradle incompatibility" 失败。显式钉 17（模板与 Gradle 都支持）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Patch Flutter Gradle settings
        run: |
          # Add gradlePluginPortal() to Flutter's settings.gradle.kts so kotlin-dsl plugin can be resolved
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          SETTINGS="$FLUTTER_SDK/packages/flutter_tools/gradle/settings.gradle.kts"
          echo "Patching $SETTINGS"
          if ! grep -q 'gradlePluginPortal' "$SETTINGS"; then
            sed -i.bak '/mavenCentral()/a\        gradlePluginPortal()' "$SETTINGS"
            echo "Patched successfully"
          else
            echo "Already patched"
          fi
      - name: Build Android APK
        run: |
          cd ai_terminal
          flutter build apk --release
      - name: Rename APK
        run: |
          cp ai_terminal/build/app/outputs/flutter-apk/app-release.apk AI_Terminal_${{ github.ref_name }}_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: AI_Terminal_${{ github.ref_name }}_Android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows
        run: |
          cd ai_terminal
          flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path ai_terminal/build/windows/x64/runner/Release/* -DestinationPath AI_Terminal_${{ github.ref_name }}_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: AI_Terminal_${{ github.ref_name }}_Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build libgcrypt20-dev libsecret-1-dev libjsoncpp-dev
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux
        run: |
          cd ai_terminal
          flutter build linux --release
      - name: Package Linux
        run: |
          cd ai_terminal/build/linux/x64/release/bundle
          tar czf ${{ github.workspace }}/AI_Terminal_${{ github.ref_name }}_Linux_x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: AI_Terminal_${{ github.ref_name }}_Linux_x64.tar.gz

  create-release:
    needs: [build-macos, build-ios, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | head -20
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Terminal ${{ github.ref_name }}
          body: |
            ## AI Terminal ${{ github.ref_name }}

            **用自然语言操控服务器，AI 替你敲命令。**

            AI Terminal 是一款将 AI 助手与 SSH / 本地终端深度集成的跨平台应用。无论你是刚买服务器的小白、不想记命令的开发者、还是需要批量管理服务器的运维人员——打开它，用中文告诉 AI 你要干什么，它帮你连服务器、跑命令、装软件、查问题。全程安全可控。

            ### 🆕 v1.5.5 命令不再卡死、假成功、被伪造

            这一版埋掉命令执行链路里的三类隐患——卡住、假成功、被伪造——外加一轮安全加固落地：主机密钥验证、命令意图分级、移动端数据库加密。

            - **未闭合命令不再进终端**：少半个引号、缺结束行的 heredoc 会把 shell 停在 PS2 等输入，完成标记永不出现，用户体感是卡住干等到超时。下发前先做静态语法判定，未闭合命令直接打回并附补全建议，同类错误连犯两次即停机请求人工；tail -f / top / vim 等持续阻塞命令同批拦截，回灌一次性等价建议（tail -n 50 / ps aux）；连续 3 轮全被拦则任务硬停止，不再空烧 AI 轮次
            - **假成功不再骗过 AI**：结尾 & 后台与修改类管道的退出码只取最后一段，AI 曾据此收到「成功」的假观测；这类命令现在下发前拦截并回灌改写建议，纯只读查询管道（ps | head 等）照常放行，不误伤
            - **完成标记伪造不了**：退出码 marker 换成每次执行随机 nonce，命令输出里出现旧格式文本（比如 grep 到旧日志）不再被误判为命令完成，真实输出不再被提前截断
            - **Ctrl+C 之后不再误伤**：中断后等 300ms 再补换行，空密码不会喂给 sudo，残留续行状态也吞不掉下一条命令
            - **主机密钥验证全面落地**：SSH/SFTP 直连与跳板首连确认信任（TOFU），指纹变更即告警拒连；known_hosts 支持导入导出
            - **命令意图与移动端加密**：命令分级新增 unknown 语义、本地目录访问改任务级授权、破坏性操作按破坏程度确认；Android/iOS 本地库整体 SQLCipher 加密，密钥入 Keystore/Keychain 并支持轮换与迁移；fetch_url 增加 SSRF 防护；数据库初始化失败给出可读失败页而非白屏

            #### 📁 继续包含
            - v1.5.3 的断连治理：半开断连秒级发现、任务跑一半也能自动重连续跑、连接超时配置真正生效、会话标题自动命名、命令卡执行中态与实时耗时、各平台包名统一
            - v1.5.2 的引擎架构治理：单文件引擎拆成各自带单测的分层（`ReActParser` / `EventStore` / `HistoryPolicy` / `PromptBuilder` / `TerminationGuard` / `CommandRunner` / `ToolOrchestrator`），全部终态写入收口到一个守卫并固化「终态硬禁令基线归零」，安全门禁学会 Windows（只读档拦下 `Set-Content` / `Out-File` / `Remove-Item`，分级前剥离 `powershell -Command` 包装），约 200 处硬编码色改为主题感知令牌让浅色主题全线达标
            - v1.5.1 的观测链路重建：失败命令把真实输出、退出码与失败分类交回模型，清洗不再吃掉 `[INFO]` 与 JSON，退出码不再跨命令串值，半截响应与纯分析正文一律不执行，无事件的老会话改结构化渲染，联网搜索设置改成行内抽屉，内置命令知识库整体下线
            - v1.5.0 的操作单国际化：188 个成员改走 ARB 键、14 种语言全覆盖、单复数拆成独立键、MCP 数字插值改模板键
            - v1.4.3 的稳定性修复：纯提问不再被逼去执行命令、追问不再复述上一轮答案、484 处文案接入双语层、AI 面板拖窄不再溢出、手绘狐狸头像
            - v1.4.2 的 Agent 实测修复：代码示例不再被当命令逐行执行、卡死的「运行中」、`Continue? y` 终端回显回灌成命令、「不许执行命令」被门控无视、命令样检索词炸全文检索、平铺与嵌套两种工具参数形状
            - v1.4.1 的 Agent 能力专项：FC 优先协议、Token 化上下文压缩与滚动摘要、运行中插话、交互提示桥接、计划跟踪与完成门控、观测分级截断与 `sftp_file_read`、`knowledge_search` 工具、只读管道放开、分屏按屏路由 AI、设置抽屉重做
            - v1.4.0 及更早：局部重建与终端输出批处理等运行时性能专项、回答整段复制与信息分级、石墨青主题、操作单与文件传输/编辑安全加固

            ### 🌟 适合谁用？

            - **小白 / 非技术人员**：不会命令行？没关系。"帮我装个 Docker"、"检查服务器漏洞"——一句话搞定
            - **开发者**：不用每次都百度同样的命令，AI 记得比你清楚
            - **运维 / DevOps**：告别重复 SSH，Agent 自动执行安装、配置、巡检；多机编排批量操作
            - **产品经理 / 一人公司**：技术合伙人的活，你一个人也能干

            ### 🚀 核心特性

            - 🤖 **Agent 智能执行**：AI 自动生成命令并循环执行（ReAct 框架），直到任务完成
            - 📊 **服务器监控**：CPU/内存/磁盘/网络实时监控面板，多主机并行
            - 📝 **变更台账**：完整审计日志，操作可追溯，变更可回滚
            - 📋 **运维工作流**：内置 Runbook 模板，一键执行常见运维任务
            - 🔔 **通知中心**：任务完成、异常告警、安全提醒，即时推送
            - 🎯 **多机编排**：单 Agent 调度多台主机，命令按 host 路由执行，状态实时回显
            - 🛡️ **三重安全防护**：行为边界提示词 → SafetyGuard 命令分级 → 危险操作需 CONFIRM 确认
            - 🔐 **零明文凭据**：密码/私钥存储在系统 Keychain / Keystore，永不明文落盘
            - 🛠️ **AI 工具调用**：SFTP 跨机上传、文件同步、经验记忆等非 shell 工具
            - 🖥️ **5 平台原生**：macOS / Linux / Windows / Android / iOS 全平台支持
            - 🌍 **14 种语言**：中文/英文/日语/韩语/法语/德语/西班牙语/俄语/葡萄牙语等
            - 📡 **SSH 远程 + 本地终端**：连接池复用，多标签共享连接，切换零延迟
            - 🌊 **流式输出**：AI 响应实时渲染，终端命令即时回显
            - 🌐 **22 个 AI 供应商**：DeepSeek / Qwen / Claude / Gemini / Ollama 等，支持远程配置更新
            - 💾 **会话持久化**：对话历史与结构化事件本地存储，切换会话不丢失上下文

            ### 🛡️ 安全设计

            - **密码存储**：系统级安全存储（macOS Keychain / Android Keystore），本地数据库只存元数据
            - **命令安全**：SafetyGuard 四级拦截——blocked 直接拦截、warn 需 CONFIRM 确认、info 低风险提示、safe 直接执行
            - **Agent 边界**：用户说"检查/查看"时只执行只读命令；禁止擅自安装/修改配置；发现问题先报告不自修
            - **变更审计**：所有 Agent 操作自动记录，支持审计追溯和回滚建议

            ### 📦 下载

            | 平台 | 文件 |
            |------|------|
            | macOS | `AI_Terminal_${{ github.ref_name }}_macOS.zip` |
            | iOS | `AI_Terminal_${{ github.ref_name }}_iOS.ipa` |
            | Android | `AI_Terminal_${{ github.ref_name }}_Android.apk` |
            | Windows | `AI_Terminal_${{ github.ref_name }}_Windows.zip` |
            | Linux x64 | `AI_Terminal_${{ github.ref_name }}_Linux_x64.tar.gz` |

            ### 🍎 macOS 安装须知

            由于本应用未经过 Apple 公证(非 App Store 分发),首次打开 macOS 会提示「无法验证开发者」。请按以下任一方式处理:

            **方式一:命令行(推荐,一行搞定)**
            ```bash
            xattr -cr "/Applications/AI Terminal.app"
            ```

            **方式二:右键打开**
            1. 解压 zip 后,将 `AI Terminal.app` 拖入 `/Applications`
            2. 在 Finder 中**右键**点击应用图标,选择「打开」
            3. 弹出对话框会多出「打开」按钮,点击即可
            4. 之后可正常打开,不会再提示

            ### 📖 文档

            - [官网](https://ai-terminal.keiskei.top)
            - [README（多语言）](https://github.com/keiskeies/ai_terminal#readme)
            - [常见问题](https://github.com/keiskeies/ai_terminal/blob/main/QUESTION.md)

            ---

            ## AI Terminal ${{ github.ref_name }}

            **Control your servers with natural language. AI runs the commands for you.**

            AI Terminal is a cross-platform app that deeply integrates an AI assistant with SSH and local terminals. Whether you're a beginner who just rented a VPS, a developer tired of googling commands, or a DevOps engineer managing dozens of servers — open it, tell the AI what you want in plain English (or Chinese), and it handles the rest. Safe, transparent, and under your control.

            ### 🆕 What's New in v1.5.5 · Commands Stop Hanging, Faking Success, and Being Forged

            This release buries three classes of hazard in the command execution path — hangs, fake successes, and forged completion markers — and lands a full security pass: host key verification, command intent grading, and encrypted mobile databases.

            - **Unclosed commands never reach the terminal**: a missing quote or heredoc terminator parks the shell at PS2 waiting for input, the completion marker never fires, and the user stares at a spinner until timeout. A static syntax precheck now rejects these before dispatch with a repair suggestion; two consecutive rejects of the same kind stop the task and ask for a human. Perpetually blocking commands (tail -f, top, vim) are intercepted the same way and answered with one-shot equivalents (tail -n 50, ps aux); three fully-blocked rounds hard-stop the task instead of burning AI turns
            - **Fake successes stop fooling the AI**: trailing & background jobs and modifying pipelines report only the last segment's exit code, so the model used to receive a confident "success" observation for work that never ran. Those commands are now intercepted with rewrite suggestions, while read-only query pipelines (ps | head) still pass through
            - **Completion markers can't be forged**: the exit-code marker now carries a per-execution random nonce, so text like the old marker format appearing in output (e.g. from grepping old logs) no longer reads as "command finished" and truncates the real output
            - **Ctrl+C stops misfiring**: after an interrupt the app waits 300ms before the follow-up newline, so an empty password never feeds sudo and a dangling continuation state cannot swallow the next command
            - **Host key verification everywhere**: SSH/SFTP direct and jump-host connections confirm the fingerprint on first use (TOFU) and refuse to connect when it changes; known_hosts import and export included
            - **Command intent and mobile encryption**: safety grading gained an unknown verdict, local directory access became task-scoped authorization, destructive operations confirm by severity; the Android/iOS local database moves fully behind SQLCipher with keys in Keystore/Keychain plus rotation and migration; fetch_url gained SSRF protection; a failed database init now shows a readable failure page instead of a white screen

            #### 📁 Still included
            - The v1.5.3 disconnect program: half-open disconnects surfaced in seconds, reconnect-and-continue mid-task, connection settings that actually apply, AI session naming, running-state command cards with live elapsed time, and one bundle id per platform
            - The v1.5.2 engine governance program: the single-file agent split into unit-tested layers (`ReActParser`, `EventStore`, `HistoryPolicy`, `PromptBuilder`, `TerminationGuard`, `CommandRunner`, `ToolOrchestrator`), every terminal-state write funneled through one guard with the task-revival race pinned at a zero baseline, safety grading that finally understands Windows (read-only mode blocks `Set-Content` / `Out-File` / `Remove-Item`, and `powershell -Command "…"` unwraps before grading), and roughly 200 hard-coded colors replaced by theme-aware tokens so light theme meets contrast
            - The v1.5.1 observation rebuild: failed commands report their real output, exit code and failure category to the model, sanitizing stops eating `[INFO]` and JSON, exit codes stop bleeding across commands, half-streamed responses and analysis prose never execute, event-less sessions render structurally, web search settings became an inline drawer, and the bundled command knowledge base was retired
            - The v1.5.0 operation sheet localization: all 188 members resolved through ARB keys in 14 languages, singulars split into separate keys, and MCP count interpolation moved to template keys
            - The v1.4.3 stability fixes: pure questions no longer forced into command execution, follow-ups no longer re-narrating the previous answer, 484 strings behind the bilingual layer, the AI panel surviving being narrowed, and the hand-drawn fox avatar
            - The v1.4.2 agent field fixes: fenced code samples typed into the terminal line by line, the zombie "running" state, `Continue? y` terminal echoes coming back as commands, the finish gate ignoring "don't run anything", command-shaped searches crashing full-text retrieval, and flattened vs nested tool parameters
            - The v1.4.1 agent capability program: Function-Calling-first protocol, token-measured context compaction with a rolling summary, mid-task interjection, bridged interactive prompts, plan tracking with a finish gate, observation-grade truncation plus `sftp_file_read`, the `knowledge_search` tool, read-only pipelines, per-pane AI routing in split views, and the rebuilt settings drawer
            - v1.4.0 and earlier: the runtime performance program, whole-answer copy and information hierarchy, the graphite theme, and the operation sheet plus file transfer/edit safety work

            ### 🌟 Who is this for?

            - **Beginners**: Never used a terminal? No problem. "Install Docker" or "check for vulnerabilities" — one sentence solves it
            - **Developers**: Stop googling the same commands. AI remembers them for you
            - **DevOps / SysAdmins**: Skip repetitive SSH sessions. Agent handles installs, configs, and health checks; orchestrate across multiple hosts
            - **PMs / Solo founders**: Run server operations without a dedicated engineer

            ### 🚀 Core Features

            - 🤖 **Agent Auto-Execution**: AI generates and executes commands in a ReAct loop until task completion
            - 📊 **Server Monitoring**: Real-time CPU/memory/disk/network dashboard, multi-host parallel
            - 📝 **Change Records**: Full audit logs, traceable operations, rollback-ready
            - 📋 **Ops Runbooks**: Built-in Runbook templates, one-click common ops tasks
            - 🔔 **Notification Center**: Task completion, anomaly alerts, security reminders — pushed instantly
            - 🎯 **Multi-Host Orchestration**: Single Agent dispatches commands across multiple hosts, routed by hostId, with live status feedback
            - 🛡️ **Triple Security**: Behavior boundary prompts → SafetyGuard command classification → Dangerous ops require CONFIRM
            - 🔐 **Zero Plaintext Credentials**: Passwords/keys in system Keychain / Keystore, never on disk
            - 🛠️ **AI Tool Calling**: SFTP cross-host upload, file sync, experience memory and other non-shell tools
            - 🖥️ **5 Native Platforms**: macOS / Linux / Windows / Android / iOS
            - 🌍 **14 Languages**: Chinese / English / Japanese / Korean / French / German / Spanish / Russian / Portuguese & more
            - 📡 **SSH Remote + Local Terminal**: Connection pooling, shared connections, zero-delay switching
            - 🌊 **Streaming Output**: Real-time AI responses and terminal output
            - 🌐 **22 AI Providers**: DeepSeek / Qwen / Claude / Gemini / Ollama & more
            - 💾 **Session Persistence**: Conversation history and structured events stored locally, no context loss when switching sessions

            ### 🛡️ Security

            - **Credential Storage**: System-level secure storage (Keychain / Keystore), metadata only in local DB
            - **Command Safety**: SafetyGuard 4-level interception — blocked / warn (CONFIRM required) / info / safe
            - **Agent Boundaries**: Read-only for "check/inspect" requests; no unauthorized installs/modifications; report first, never self-fix
            - **Change Auditing**: All Agent operations automatically logged, with audit trail and rollback suggestions

            ### 📥 Downloads

