name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd ai_terminal
          flutter pub get
      - name: Generate code (build_runner)
        run: |
          cd ai_terminal
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: |
          cd ai_terminal
          # info 级 lint（prefer_const 等风格建议）不设防，warning/error 仍致失败
          flutter analyze --no-fatal-infos
      - name: Test
        run: |
          cd ai_terminal
          flutter test
      - name: Guard terminal-state writes (ratchet)
        run: python3 tools/check_terminal_writes.py
